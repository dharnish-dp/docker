# deploy.yml — Full CI/CD Pipeline
#
# Triggers: every push to main branch
# Jobs: test → build-and-push → deploy
#
# GitHub Actions concepts:
# - workflow = this entire file
# - job = a group of steps that run on the same machine
# - step = one command or action
# - action = reusable step from GitHub Marketplace (uses: someone/action@v1)
# - secret = encrypted value stored in GitHub, never in code

name: Build, Test, and Deploy

# ── When to run ─────────────────────────────────────────────────────
on:
  push:
    branches: [main]          # run on every push to main
  pull_request:
    branches: [main]          # also run tests on PRs (but don't deploy)

# ── Environment variables shared across all jobs ─────────────────────
env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/my-fastapi

# ── Jobs ─────────────────────────────────────────────────────────────
jobs:

  # ── Job 1: Run Tests ───────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest      # GitHub provides this Ubuntu VM for free

    steps:
      # Step 1: Download your code onto the CI machine
      - name: Checkout code
        uses: actions/checkout@v4
        # This is a GitHub Action from the marketplace
        # It runs: git clone your_repo .

      # Step 2: Run tests inside Docker (same environment as production)
      - name: Run tests in Docker
        run: |
          # Build and run the test compose stack
          # --abort-on-container-exit = stop all containers when tests finish
          # --exit-code-from tests = use test container's exit code
          # (0 = passed, non-zero = failed — fails the CI job)
          docker compose -f docker-compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from tests

      # Step 3: Save test reports so you can download them from GitHub UI
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()            # upload even if tests failed
        with:
          name: test-reports
          path: reports/        # matches the reports volume in docker-compose.test.yml


  # ── Job 2: Build and Push Image ────────────────────────────────────
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: test                 # only run if test job passed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Extract metadata for tagging (version from git tag, short SHA, etc.)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=           # short git SHA (e.g. abc1234)
            type=ref,event=branch      # branch name (e.g. main)
            type=semver,pattern={{version}}  # version tag if you push v1.0.0

      # Login to Docker Hub using secrets (never hardcoded)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Set up BuildKit for faster builds (cache, multi-platform)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image and push to Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true             # push to registry (true for main, false for PRs)
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache to speed up builds
          # Layers are cached in GitHub's cache storage between runs
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ── Job 3: Deploy to VPS ───────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push           # only run after successful build
    if: github.ref == 'refs/heads/main'  # only deploy from main branch (not PRs)

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        # This action SSHs into your server and runs commands
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/app

            # Pull the new image (tagged with the git SHA)
            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

            # Update the image version in .env
            echo "APP_VERSION=${{ github.sha }}" >> .env

            # Restart only the app container — DB and Redis stay running
            docker compose up -d --no-deps app

            # Wait and verify
            sleep 10
            docker compose ps
            echo "Deployment complete: ${{ github.sha }}"
