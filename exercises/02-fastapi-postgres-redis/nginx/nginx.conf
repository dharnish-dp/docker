# nginx.conf — Reverse proxy configuration
#
# Nginx sits in front of FastAPI:
# Browser → Nginx:80 → FastAPI:8000
#
# Benefits:
# - Handles SSL termination (in production)
# - Serves static files efficiently
# - Load balances across multiple app instances
# - Rate limiting and security headers

events {
    worker_connections 1024;  # max simultaneous connections per worker
}

http {
    # Upstream = the backend server(s) to proxy to
    # "app" = service name in docker-compose.yml (Docker DNS resolves it)
    # "8000" = the port FastAPI listens on inside its container
    upstream fastapi {
        server app:8000;
    }

    server {
        listen 80;                    # Nginx listens on port 80

        # Proxy all requests to FastAPI
        location / {
            proxy_pass http://fastapi;

            # Forward real client IP to FastAPI
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Support WebSocket connections (needed for FastAPI /ws endpoints)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
    }
}
