services:

  # ── PostgreSQL Database ────────────────────────────────────────────
  db:
    image: postgres:16-alpine           # Alpine = minimal Postgres image
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}   # loaded from .env file
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data  # persist database files
    networks:
      - app-network
    healthcheck:
      # pg_isready = Postgres utility that checks if DB is accepting connections
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  # ── Redis Cache ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - redisdata:/data               # persist Redis snapshots
    healthcheck:
      # redis-cli ping returns "PONG" when Redis is ready
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  # ── FastAPI Application ────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db              # service name = DNS hostname
      - REDIS_HOST=redis
      - REDIS_TTL=${REDIS_TTL}
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy    # wait until Postgres is ready
      redis:
        condition: service_healthy    # wait until Redis is ready
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  # ── Nginx Reverse Proxy ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"                       # expose port 80 to your Mac
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro  # read-only config
    networks:
      - app-network
    depends_on:
      app:
        condition: service_healthy    # don't start until app is ready


# ── Networks ───────────────────────────────────────────────────────
networks:
  app-network:                        # all services communicate here


# ── Volumes ────────────────────────────────────────────────────────
volumes:
  pgdata:                             # PostgreSQL data persists here
  redisdata:                          # Redis snapshots persist here
